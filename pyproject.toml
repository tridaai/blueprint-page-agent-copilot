[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trida-blueprint-page-agent-copilot"
version = "0.1.0"
description = "Trida AI Blueprint — Page Agent Admin Copilot: a governed task shell around Alibaba PageAgent for legacy admin consoles (reference prototype)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
# Direct dependencies are pinned EXACTLY (==). The full transitive set is
# frozen in constraints.txt; the pip fallback installs that set first and
# the package itself second (see Makefile, target install-pip).
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.2.9",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
page-agent-copilot = "page_agent_copilot.cli:main"
page-agent-copilot-demo = "page_agent_copilot.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
page_agent_copilot = ["static/*.html", "static/*.js", "static/vendor/*.js"]
